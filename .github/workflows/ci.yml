name: ci

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@03d53ec146797bc27d7b8b37abbf766ab82041b6 # v0.6.81
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      recipe: ci
      fetch-depth: 0
      bun-version: '1.4.2'
      uv-version: '0.12.13'
      tools: zizmor@1.32.0
      tool-assets: .github/source-tools.json
      images: true
      timeout-minutes: 20

  merge-stops:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@03d53ec146797bc27d7b8b37abbf766ab82041b6 # v0.6.81
    permissions:
      contents: read
